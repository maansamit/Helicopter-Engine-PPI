name: ppi
description: "Professional Aviation PPI Calculator"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  shared_preferences: ^2.2.2 
  fl_chart: ^0.66.0           
  intl: ^0.19.0               
  google_fonts: ^6.1.0        

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  # Icon generate karne ke liye plugin
  flutter_launcher_icons: ^0.13.1

# Icon configuration
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/helicopter.png"
  min_sdk_android: 21 
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/helicopter.png"

flutter:
  uses-material-design: true
  assets:
    - assets/helicopter.png